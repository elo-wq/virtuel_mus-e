<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #f4f4f1;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}


/* =========================
   HEADER
========================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 12px 15px;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    z-index: 100;
}

header a {
    color: #111;
    text-decoration: none;
}

nav {
    display: flex;
    gap: 18px;
}

nav a:hover {
    text-decoration: underline;
}


/* =========================
   INTRODUCTION
========================= */

.intro {
    width: 100%;
    padding: 70px 15px 50px 15px;

    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 30px;

    align-items: start;
}


/* IMAGE INTRO */

.intro-image {
    width: 100%;
}

.intro-image img {
    width: 100%;
    height: auto;
    display: block;

    cursor: pointer;
}


/* TEXTE INTRO */

.intro-text {
    padding-top: 5px;
    max-width: 300px;
    line-height: 1.35;
}


/* =========================
   GRILLE
========================= */

.grid {
    width: 100%;
    padding: 0 15px 15px 15px;

    display: grid;

    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, auto);

    gap: 15px;
}


/* =========================
   CASE
========================= */

.item {
    position: relative;
    width: 100%;

    overflow: hidden;

    background: #ddd;

    text-decoration: none;
    color: #111;

    cursor: pointer;
}


/* =========================
   IMAGE
========================= */

.item img {
    width: 100%;
    height: auto;

    display: block;

    object-fit: cover;

    transition: opacity 0.15s ease;
}

.item:hover img {
    opacity: 0.75;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    background: rgba(244, 244, 241, 0.96);

    z-index: 1000;

    opacity: 0;
    visibility: hidden;

    transition: opacity 0.2s ease;

    overflow: hidden;

}


/* LIGHTBOX OUVERTE */

.lightbox.active {

    opacity: 1;
    visibility: visible;

}


/* =========================
   CONTENEUR IMAGE
========================= */

.lightbox-content {

    width: 100%;
    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 40px 50px;

}


/* IMAGE AGRANDIE */

.lightbox img {

    max-width: 92vw;
    max-height: 88vh;

    width: auto;
    height: auto;

    object-fit: contain;

    display: block;

    cursor: pointer;

}


/* =========================
   BOUTON FERMER
========================= */

.lightbox-close {

    position: fixed;

    top: 12px;
    right: 15px;

    font-size: 20px;

    line-height: 1;

    cursor: pointer;

    z-index: 1002;

}


/* =========================
   INDICATION
========================= */

.lightbox-info {

    position: fixed;

    bottom: 12px;
    left: 15px;

    z-index: 1002;

    font-size: 13px;

    pointer-events: none;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .intro {

        grid-template-columns: 1fr;

        gap: 15px;

        padding: 60px 8px 35px 8px;

    }

    .intro-text {

        max-width: none;

    }

    .grid {

        grid-template-columns: repeat(2, 1fr);

        gap: 8px;

        padding: 0 8px 8px 8px;

    }

    .lightbox-content {

        padding: 30px 10px;

    }

    .lightbox img {

        max-width: 96vw;

        max-height: 88vh;

    }

}


/* =========================
   DESKTOP
========================= */

@media (min-width: 601px) {

    .lightbox img {

        transition: transform 0.15s ease;

    }

    
footer{

    position:relative;

    padding:20px 15px;

    border-top:1px solid #111;

    display:flex;

    justify-content:space-between;

    font-size:10px;

}

footer a{

    color:#111;
    text-decoration:none;

}


}

<script>


/* =========================
   RÉCUPÉRATION DES IMAGES
========================= */

const imageElements = document.querySelectorAll(
    ".intro-image img, .grid img"
);

const lightbox = document.getElementById("lightbox");

const lightboxImage = document.getElementById("lightboxImage");

const lightboxClose = document.getElementById("lightboxClose");

const lightboxInfo = document.getElementById("lightboxInfo");


/* =========================
   INDEX ACTUEL
========================= */

let currentIndex = 0;


/* =========================
   OUVRIR UNE IMAGE
========================= */

function openImage(index) {

    if (index < 0) {
        index = imageElements.length - 1;
    }

    if (index >= imageElements.length) {
        index = 0;
    }

    currentIndex = index;

    lightboxImage.src = imageElements[currentIndex].src;

    lightboxInfo.textContent =
        (currentIndex + 1) + " / " + imageElements.length;

    lightbox.classList.add("active");

    document.body.style.overflow = "hidden";

}


/* =========================
   FERMER
========================= */

function closeLightbox() {

    lightbox.classList.remove("active");

    document.body.style.overflow = "";

}


/* =========================
   IMAGE CLIQUÉE
========================= */

imageElements.forEach(function(image, index) {

    image.addEventListener("click", function(event) {

        event.preventDefault();

        openImage(index);

    });

});


/* =========================
   IMAGE SUIVANTE
========================= */

function nextImage() {

    openImage(currentIndex + 1);

}


/* =========================
   IMAGE PRÉCÉDENTE
========================= */

function previousImage() {

    openImage(currentIndex - 1);

}


/* =========================
   SCROLL
========================= */

let scrolling = false;

lightbox.addEventListener(
    "wheel",
    function(event) {

        event.preventDefault();

        if (scrolling) {
            return;
        }

        scrolling = true;


        if (event.deltaY > 0) {

            nextImage();

        } else {

            previousImage();

        }


        setTimeout(function() {

            scrolling = false;

        }, 400);

    },
    { passive: false }
);


/* =========================
   CLAVIER
========================= */

document.addEventListener("keydown", function(event) {

    if (!lightbox.classList.contains("active")) {
        return;
    }


    if (event.key === "Escape") {

        closeLightbox();

    }


    if (event.key === "ArrowDown" ||
        event.key === "ArrowRight") {

        nextImage();

    }


    if (event.key === "ArrowUp" ||
        event.key === "ArrowLeft") {

        previousImage();

    }

});


/* =========================
   FERMER AVEC LE ×
========================= */

lightboxClose.addEventListener("click", function(event) {

    event.stopPropagation();

    closeLightbox();

});


/* =========================
   CLIQUER À CÔTÉ DE L'IMAGE
========================= */

lightbox.addEventListener("click", function(event) {

    if (event.target === lightbox) {

        closeLightbox();

    }

});


</script>
