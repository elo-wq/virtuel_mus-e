<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flux — 349 images</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #f4f4f1;
            color: #111;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            background: #f4f4f1;
            z-index: 1000;
            border-bottom: 1px solid #e0e0dc;
        }

        button {
            border: none;
            background: none;
            font-family: Arial, sans-serif;
            font-size: 13px;
            cursor: pointer;
            padding: 5px 10px;
        }

        button:hover {
            text-decoration: underline;
        }

        .grid {
            padding: 50px 10px 10px 10px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #e0e0dc;
        }

        .cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #f4f4f1;
            z-index: 2000;
            font-size: 13px;
            padding: 20px;
            text-align: center;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 3px;
                padding: 45px 5px 5px 5px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="info">349 images — flux</div>
        <button id="stop">STOP</button>
    </header>

    <div id="loading">
        Chargement : <span id="progress">0</span> / 349
    </div>

    <div class="grid" id="grid"></div>

    <script>
        const nombreImages = 349;
        const nombreCellules = 80;
        const vitesse = 1000; // millisecondes par image

        const images = [];
        const cellules = [];
        let chargees = 0;
        let animation = null;
        let dernierTemps = 0;
        let enLecture = true;

        function chargerImage(numero) {
            return new Promise((resolve) => {
                const img = new Image();
                const numeroImage = String(numero).padStart(4, "0");
                
                // Utilisation d'un chemin relatif compatible GitHub Pages
                img.src = `images_bright1/${numeroImage}.jpg`;

                img.onload = () => {
                    chargees++;
                    document.getElementById("progress").textContent = chargees;
                    resolve(img);
                };

                img.onerror = () => {
                    console.warn(`Image introuvable : ${numeroImage}.jpg`);
                    chargees++;
                    document.getElementById("progress").textContent = chargees;
                    resolve(null);
                };
            });
        }

        async function chargerToutesLesImages() {
            const tailleGroupe = 8; // Légèrement augmenté pour aller un peu plus vite tout évitant le rate limit

            for (let debut = 1; debut <= nombreImages; debut += tailleGroupe) {
                const groupe = [];
                for (let i = debut; i < debut + tailleGroupe && i <= nombreImages; i++) {
                    groupe.push(chargerImage(i));
                }
                const resultat = await Promise.all(groupe);
                for (const img of resultat) {
                    if (img) {
                        images.push(img);
                    }
                }
            }

            document.getElementById("loading").style.display = "none";
            
            if (images.length > 0) {
                creerGrille();
            } else {
                document.getElementById("loading").style.display = "block";
                document.getElementById("loading").textContent = "Erreur : aucune image chargée.";
            }
        }

        function creerGrille() {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            for (let i = 0; i < nombreCellules; i++) {
                const cell = document.createElement("div");
                cell.className = "cell";

                const image = document.createElement("img");
                let position = i % images.length;
                image.src = images[position].src;

                cell.appendChild(image);
                grid.appendChild(cell);

                cellules.push({
                    element: cell,
                    image: image,
                    position: position
                });
            }

            demarrerAnimation();
        }

        function avancer() {
            for (const cellule of cellules) {
                cellule.position = (cellule.position + 1) % images.length;
                cellule.image.src = images[cellule.position].src;
            }
        }

        // Utilisation d'une boucle temporelle fluide
        function bouclerAnimation(tempsActuel) {
            if (!enLecture) return;

            if (!dernierTemps) dernierTemps = tempsActuel;
            const écoulé = tempsActuel - dernierTemps;

            if (écoulé >= vitesse) {
                avancer();
                dernierTemps = tempsActuel;
            }

            animation = requestAnimationFrame(bouclerAnimation);
        }

        function demarrerAnimation() {
            if (!animation) {
                dernierTemps = 0;
                animation = requestAnimationFrame(bouclerAnimation);
            }
        }

        function arreterAnimation() {
            if (animation) {
                cancelAnimationFrame(animation);
                animation = null;
            }
        }

        const bouton = document.getElementById("stop");
        bouton.addEventListener("click", () => {
            if (enLecture) {
                arreterAnimation();
                bouton.textContent = "PLAY";
                enLecture = false;
            } else {
                enLecture = true;
                demarrerAnimation();
                bouton.textContent = "STOP";
            }
        });

        // Lancement au chargement de la page
        chargerToutesLesImages();
    </script>
</body>
</html>
