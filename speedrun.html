<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>flux</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    background: #f4f4f1;
    color: #111;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
}


/* =========================
   HEADER
   ========================= */

header {
    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 10px;

    z-index: 10;

    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    pointer-events: none;
}


/* =========================
   PETIT TEXTE
   ========================= */

.info {
    max-width: 300px;

    line-height: 1.2;
}


/* =========================
   BOUTON STOP
   ========================= */

#stopButton {

    pointer-events: auto;

    border: none;

    background: transparent;

    padding: 0;

    margin: 0;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;

    color: #111;

    cursor: pointer;

    text-decoration: underline;
}

#stopButton:hover {
    opacity: 0.5;
}


/* =========================
   GRILLE
   ========================= */

.grid {

    width: 100%;

    padding: 45px 10px 10px 10px;

    display: grid;

    grid-template-columns: repeat(9, 1fr);

    gap: 5px;
}


/* =========================
   CASE
   ========================= */

.cell {

    width: 100%;

    overflow: hidden;

    background: #ddd;

}


/* =========================
   IMAGE
   ========================= */

.cell img {

    display: block;

    width: 100%;
    height: auto;

}


/* =========================
   TABLETTE
   ========================= */

@media (max-width: 800px) {

    .grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
    }

}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 500px) {

    .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 3px;
    }

}

</style>

</head>


<body>


<header>

    <div class="info">
        350 images — flux
    </div>

    <button id="stopButton">
        STOP
    </button>

</header>


<div class="grid" id="grid"></div>


<script>


/* =========================
   PARAMÈTRES
   ========================= */

const nombreImages = 350;

const vitesse = 280;

const nombreCellules = 80;


/* =========================
   CRÉATION DE LA GRILLE
   ========================= */

const grid = document.getElementById("grid");

const cellules = [];


for (let i = 0; i < nombreCellules; i++) {

    const cell = document.createElement("div");

    cell.className = "cell";


    const img = document.createElement("img");


    let numero = i + 1;


    img.src =
        "images_bright/" +
        String(numero).padStart(4, "0") +
        ".jpg";


    img.alt = "";


    cell.appendChild(img);

    grid.appendChild(cell);


    cellules.push({

        image: img,

        position: numero

    });

}


/* =========================
   ANIMATION
   ========================= */

let animation = setInterval(() => {

    cellules.forEach(cell => {

        cell.position++;


        if (cell.position > nombreImages) {

            cell.position = 1;

        }


        const numero =
            String(cell.position).padStart(4, "0");


        cell.image.src =
            "images_bright/" +
            numero +
            ".jpg";

    });

}, vitesse);


/* =========================
   STOP / PLAY
   ========================= */

const stopButton =
    document.getElementById("stopButton");

let stopped = false;


stopButton.addEventListener("click", () => {

    if (!stopped) {

        clearInterval(animation);

        stopButton.textContent = "PLAY";

        stopped = true;

    } else {

        animation = setInterval(() => {

            cellules.forEach(cell => {

                cell.position++;


                if (cell.position > nombreImages) {

                    cell.position = 1;

                }


                const numero =
                    String(cell.position).padStart(4, "0");


                cell.image.src =
                    "images_bright1/" +
                    numero +
                    ".jpg";

            });

        }, vitesse);


        stopButton.textContent = "STOP";

        stopped = false;

    }

});


</script>


</body>

</html>
